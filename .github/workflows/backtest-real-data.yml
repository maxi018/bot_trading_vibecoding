# Backtest con datos REALES de Binance (data.binance.vision, SHA-256 verificado).
#
# - Manual: Actions → "Backtest con datos reales" → Run workflow (símbolos, timeframes, rango).
# - Automático: cuando cambia algo que afecta un backtest (estrategia, riesgo, ejecución,
#   backtester: para que nadie "mejore" nada sin ver qué pasa con datos de verdad), y
#   una vez por mes.
#
# Cada (config × timeframe) es una PRUEBA más: el Deflated Sharpe se calcula con
# --trials = TRIALS_PRIOR + configs × timeframes. Probar 5 variantes y mostrar la mejor
# sin descontarlo es exactamente el sobreajuste que este workflow existe para evitar.
# Las configs de experimentos (config/experiments/) corren al lado de la base.
#
# Resultados: resumen en la página del run + artifacts (datos CSV y JSON de resultados).
name: Backtest con datos reales

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Símbolos (separados por coma)"
        default: "BTC/USDT,ETH/USDT"
      timeframes:
        description: "Timeframes (separados por coma; cada uno cuenta como una prueba)"
        default: "1h,4h,1d"
      configs:
        description: "Configs (separadas por coma; cada una × cada timeframe = una prueba)"
        default: "config/default.toml,config/experiments/03_sma200.toml,config/experiments/05_meanrev.toml"
      start:
        description: "Desde (AAAA-MM)"
        default: "2019-01"
      end:
        description: "Hasta (AAAA-MM; vacío = último mes completo)"
        default: ""
  push:
    paths:
      - ".github/workflows/backtest-real-data.yml"
      # Todo lo que cambia un resultado de backtest (no la API/dashboard ni el modo live).
      - "trading_bot/quantbot/**"
      - "!trading_bot/quantbot/api/**"
      - "!trading_bot/quantbot/app.py"
      - "!trading_bot/quantbot/data/demo_feed.py"
      - "!trading_bot/quantbot/data/websocket_feed.py"
      - "!trading_bot/quantbot/execution/ccxt_exchange.py"
      - "trading_bot/config/default.toml"
  schedule:
    - cron: "17 6 2 * *" # día 2 de cada mes: suma el mes que cerró

permissions:
  contents: read

# shell explícito = bash -eo pipefail: sin esto, `python ... | tee` que falla da verde.
# OJO: los `defaults` de un job REEMPLAZAN a estos (no se combinan): repetir ahí.
defaults:
  run:
    shell: bash

concurrency:
  group: backtest-real-${{ github.ref }}
  cancel-in-progress: true

env:
  SYMBOLS: ${{ inputs.symbols || 'BTC/USDT,ETH/USDT' }}
  TIMEFRAMES: ${{ inputs.timeframes || '1h,4h,1d' }}
  START: ${{ inputs.start || '2019-01' }}
  END: ${{ inputs.end }}
  CONFIGS: ${{ inputs.configs || 'config/default.toml,config/experiments/03_sma200.toml,config/experiments/05_meanrev.toml' }}
  PYTHONUNBUFFERED: "1"
  # Pruebas ya hechas que este workflow NO corre (ver trading_bot/research/LOG.md).
  # El Deflated Sharpe usa TRIALS_PRIOR + configs × timeframes de esta corrida.
  TRIALS_PRIOR: "0"

jobs:
  data:
    name: Descargar y validar datos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: trading_bot
    outputs:
      symbols: ${{ steps.matrix.outputs.symbols }}
      timeframes: ${{ steps.matrix.outputs.timeframes }}
      configs: ${{ steps.matrix.outputs.configs }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e .   # el núcleo es solo stdlib
      - uses: actions/cache@v5
        with:
          path: trading_bot/data/.cache
          key: binance-v2-${{ github.run_id }}
          restore-keys: binance-v2-
      - name: Descargar (checksum SHA-256 por archivo)
        run: |
          IFS=',' read -ra TFS <<< "$TIMEFRAMES"
          for tf in "${TFS[@]}"; do
            python -m quantbot download --symbol "$SYMBOLS" --timeframe "$tf" \
              --start "$START" ${END:+--end "$END"} --out-dir data | tee -a download.txt
          done
      - id: matrix
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          split = lambda v: [x.strip() for x in os.environ[v].split(",") if x.strip()]
          print("symbols=" + json.dumps(split("SYMBOLS")))
          print("timeframes=" + json.dumps(split("TIMEFRAMES")))
          # {path, name}: el nombre (sin "/") va en títulos de jobs y nombres de artifacts.
          configs = [{"path": c, "name": c.rsplit("/", 1)[-1].removesuffix(".toml")} for c in split("CONFIGS")]
          for c in configs:
              assert os.path.exists(c["path"]), c["path"]
          print("configs=" + json.dumps(configs))
          PY
      - name: Resumen
        run: |
          { echo "### Datos ($TIMEFRAMES, desde $START)"; echo '```'; cat download.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: market-data
          path: trading_bot/data/*.csv
          retention-days: 30

  backtest:
    name: Backtest ${{ matrix.config.name }} ${{ matrix.timeframe }} + costos x2 + Monte Carlo
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        timeframe: ${{ fromJSON(needs.data.outputs.timeframes) }}
        config: ${{ fromJSON(needs.data.outputs.configs) }}
    defaults:
      run:
        shell: bash
        working-directory: trading_bot
    env:
      TF: ${{ matrix.timeframe }}
      CONFIG: ${{ matrix.config.path }}
      NAME: ${{ matrix.config.name }}
      TRIALS_HERE: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: market-data
          path: trading_bot/data
      - name: Backtest (portafolio completo)
        run: |
          TRIALS=$((TRIALS_PRIOR + TRIALS_HERE))
          echo "TRIALS=$TRIALS" >> "$GITHUB_ENV"
          DATA=$(python -c "import os; print(','.join('data/%s_%s.csv' % (s.strip().replace('/', '').upper(), os.environ['TF']) for s in os.environ['SYMBOLS'].split(',') if s.strip()))")
          mkdir -p results
          # Parámetros del TOML fijados ANTES de mirar estos datos; config × timeframe = 1 prueba.
          python -m quantbot backtest --config "$CONFIG" --data "$DATA" --symbol "$SYMBOLS" \
            --timeframe "$TF" --trials "$TRIALS" --montecarlo \
            --out "results/${NAME}_$TF.json" | tee "results/${NAME}_$TF.txt"
          python -m quantbot backtest --config "$CONFIG" --data "$DATA" --symbol "$SYMBOLS" \
            --timeframe "$TF" --trials "$TRIALS" --stress 2.0 | tee "results/${NAME}_${TF}_stress2.txt"
      - name: Resumen
        run: |
          {
            echo "### Backtest $NAME $TF: $SYMBOLS (Deflated Sharpe con $TRIALS pruebas)"
            echo '```'; cat "results/${NAME}_$TF.txt"; echo '```'
            echo "### $NAME $TF con costos x2 (si acá muere, el edge eran los costos)"
            echo '```'; cat "results/${NAME}_${TF}_stress2.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: backtest-results-${{ matrix.config.name }}-${{ matrix.timeframe }}
          path: trading_bot/results/
          retention-days: 90

  walkforward:
    name: Walk-forward ${{ matrix.config.name }} ${{ matrix.symbol }} ${{ matrix.timeframe }}
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        symbol: ${{ fromJSON(needs.data.outputs.symbols) }}
        timeframe: ${{ fromJSON(needs.data.outputs.timeframes) }}
        config: ${{ fromJSON(needs.data.outputs.configs) }}
    defaults:
      run:
        shell: bash
        working-directory: trading_bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: market-data
          path: trading_bot/data
      - name: Walk-forward (train 1 año, test 3 meses, deslizante)
        env:
          SYMBOL: ${{ matrix.symbol }}
          TF: ${{ matrix.timeframe }}
          CONFIG: ${{ matrix.config.path }}
          NAME: ${{ matrix.config.name }}
        run: |
          RAW=$(echo "$SYMBOL" | tr -d '/' | tr '[:lower:]' '[:upper:]')
          # Ventanas en TIEMPO, no en barras: 1 año de 1h = 8760 barras, de 4h = 2190.
          # El warmup nunca queda por debajo de lo que pide la estrategia (filtro de 200 días).
          # Grilla propia del experimento (config/experiments/<nombre>.grid) o la de la base.
          GRID=$(cat "${CONFIG%.toml}.grid" 2>/dev/null || echo "fast_ema=10,20,30;slow_ema=100,200")
          echo "Grilla walk-forward: $GRID"
          read -r TRAIN TEST WARMUP < <(python -c "import os; from quantbot.core.clock import periods_per_year as p; y = p(os.environ['TF']); print(round(y), round(y / 4), min(600, round(y / 4)))")
          python -m quantbot walkforward --config "$CONFIG" --timeframe "$TF" \
            --data "data/${RAW}_${TF}.csv" --symbol "$SYMBOL" \
            --grid "$GRID" \
            --train "$TRAIN" --test "$TEST" --warmup "$WARMUP" | tee wf.txt
          # El resumen de GitHub admite 1 MB por paso: solo el final (resumen y ventanas).
          { echo "### Walk-forward $NAME $SYMBOL $TF"; echo "Grilla: \`$GRID\`"; echo '```'; tail -n 120 wf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
